<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shannon — Personal Business Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0e0e0e;
      --cream: #f5f3ef;
      --gold: #b89c6e;
      --gold-light: #d4bc96;
      --mist: #e8e4dd;
      --text-muted: #7a7369;
      --white: #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── HEADER / NAV ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      background: rgba(245, 243, 239, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--mist);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .logo span { color: var(--gold); }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--mist);
      border: 1px solid var(--gold-light);
      border-radius: 100px;
      padding: 0.35rem 0.9rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf6e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 3rem;
      text-align: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 7vw, 6rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-desc {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text-muted);
      font-weight: 300;
    }

    .divider {
      width: 3rem; height: 1px;
      background: var(--gold);
    }

    /* ElevenLabs widget */
    .widget-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .widget-hint {
      font-size: 0.73rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    elevenlabs-convai {
      width: 100%;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      width: 100%;
      border-top: 1px solid var(--mist);
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--ink);
    }

    .footer-brand span { color: var(--gold); }

    .footer-copy {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero { animation: fadeUp 0.8s ease both; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      header { padding: 1.2rem 1.5rem; }
      .logo { font-size: 1.25rem; }

      .hero {
        padding: 7rem 1.5rem 4rem;
      }

      footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <header>
    <div class="logo">Shannon<span>.</span></div>
    <div class="status-pill">
      <div class="status-dot"></div>
      Available 24 / 7
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1><em>Shannon</em></h1>
    <div class="divider"></div>
    <p class="hero-desc">Personal Business Assistant</p>
    <div class="widget-wrapper">
      <p class="widget-hint">Tap the mic to connect with Shannon instantly</p>
      <elevenlabs-convai agent-id="agent_0401ks4c5b8yfhyb25j32hjqs25y"></elevenlabs-convai>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">Shannon<span>.</span></div>
    <p class="footer-copy">Powered by ElevenLabs AI · Available 24 hours a day, 7 days a week</p>
  </footer>

  <!-- ElevenLabs SDK -->
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>

</body>
</html>
